# Неверный или пустой пароль basic auth в Caddy: ответ 401 в журнале /var/log/caddy/access.log (JSON).
# Копия: /etc/fail2ban/filter.d/tanbala-caddy-auth.conf. Браузер на первом заходе сам получает один 401:
# поэтому в jail порог 10 за 10 минут, а не 3.

[Definition]
failregex = ^\{.*"remote_ip":"<HOST>".*"status":401[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
