# Неудачный вход в консоль panel.tanbala.kz в журнале Caddy /var/log/caddy/access.log (JSON, caddy/common.caddy).
# Копия: /etc/fail2ban/filter.d/tanbala-console-login.conf.
# Считается любой POST на panel.tanbala.kz с ответом 401. Консоль отвечает 401 только на неверное имя или пароль
# («нет сессии» у опросов страницы — 403, поэтому истёкшая сессия владельца сюда не попадает), остальные 401 на этом
# имени — пароль Caddy. Путь не сверяется: роутер консоли понимает и /api/%6Cogin, а в журнале путь как прислан. Имя
# сайта — без учёта регистра и с портом или без: Caddy пускает PANEL.tanbala.kz:443 туда же, а пишет как прислано.
# Ответы 429 не считаются: их даёт и ограничитель по имени (10 неудач за час с любых адресов) и очередь проверок,
# то есть чужой подбор пароля к имени владельца забанил бы самого владельца. Свои 5 неудач (401) с одного адреса
# fail2ban ловит раньше, чем консоль начнёт отвечать этому адресу 429.
# Адрес — remote_ip, TCP-адрес клиента у Caddy (не заголовок X-Forwarded-For). Строка запроса из журнала вырезана,
# путь остаётся. Порядок полей у Caddy: request{remote_ip, remote_port, client_ip, proto, method, host, uri, headers,
# tls}, затем bytes_read, user_id, duration, size, status, resp_headers. Кавычки внутри заголовков в JSON экранированы
# (\"), поэтому подставить "host" или "status" через заголовок нельзя. Строка для проверки:
# {"level":"info","ts":1761800000.123456,"logger":"http.log.access.log3","msg":"handled request","request":{"remote_ip":"203.0.113.7","remote_port":"51234","client_ip":"203.0.113.7","proto":"HTTP/2.0","method":"POST","host":"panel.tanbala.kz","uri":"/api/login","headers":{"Content-Type":["application/json"],"Origin":["https://panel.tanbala.kz"],"Authorization":["REDACTED"]},"tls":{"resumed":false,"version":772,"cipher_suite":4865,"proto":"h2","server_name":"panel.tanbala.kz"}},"bytes_read":42,"user_id":"owner","duration":0.31,"size":72,"status":401,"resp_headers":{"Content-Type":["application/json; charset=utf-8"],"Cache-Control":["no-store"]}}
# Проверить на сервере на настоящем журнале:
#   fail2ban-regex /var/log/caddy/access.log /etc/fail2ban/filter.d/tanbala-console-login.conf

[Definition]
failregex = ^\{.*"remote_ip":"<HOST>".*"method":"POST".*"host":"(?i:panel\.tanbala\.kz)(?::\d+)?".*"status":401[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
