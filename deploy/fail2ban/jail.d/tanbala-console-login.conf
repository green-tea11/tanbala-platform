# Блок IP после 5 неудачных входов в консоль panel.tanbala.kz (ответ 401) за 10 минут, на час. Копия:
# /etc/fail2ban/jail.d/tanbala-console-login.conf. Порог как у ограничителя самой консоли (5 неудач за 10 минут
# на адрес): fail2ban закрывает адрес уже на уровне сервера. Ответы 401 консоли попадают и в tanbala-caddy-auth
# (любой 401), там порог 10. Блок на порты 80 и 443: вместе с консолью закрываются и wa., leads., tanbala.kz.
# Посмотреть: fail2ban-client status tanbala-console-login.
# Снять блок: fail2ban-client set tanbala-console-login unbanip IP (и в tanbala-caddy-auth, если IP есть и там).

[tanbala-console-login]
enabled = true
port = http,https
filter = tanbala-console-login
logpath = /var/log/caddy/access.log
backend = polling
# Сам сервер (health.sh) не блокируем.
ignoreip = 127.0.0.1/8 ::1 91.201.215.210
maxretry = 5
findtime = 10m
bantime = 1h
