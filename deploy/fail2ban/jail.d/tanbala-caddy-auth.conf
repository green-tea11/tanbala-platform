# Блок IP после 10 ответов 401 (пароль Caddy) за 10 минут, на час. Копия: /etc/fail2ban/jail.d/tanbala-caddy-auth.conf.
# Проверка хэша пароля (bcrypt) тяжёлая для 2 vCPU: подбор пароля заодно грузил бы сервер.
# Посмотреть: fail2ban-client status tanbala-caddy-auth. Снять блок: fail2ban-client set tanbala-caddy-auth unbanip IP

[tanbala-caddy-auth]
enabled = true
port = http,https
filter = tanbala-caddy-auth
logpath = /var/log/caddy/access.log
backend = polling
maxretry = 10
findtime = 10m
bantime = 1h
