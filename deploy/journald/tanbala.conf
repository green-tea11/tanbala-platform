# Журнал systemd (логи почты, бота, Caddy, копий): не больше 1 ГБ на диске и не старше месяца.
# Копия: /etc/systemd/journald.conf.d/tanbala.conf, затем systemctl restart systemd-journald.
# Тексты сообщений, номера клиентов и строки запросов проекты в журнал не пишут.

[Journal]
SystemMaxUse=1G
MaxRetentionSec=1month
