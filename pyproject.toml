[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanbala-leads"
version = "0.1.0"
description = "Поиск клиентов для Tanbala: 2ГИС, почты с сайтов, квалификация и черновики писем"
requires-python = ">=3.11"
# parser-2gis здесь нет: ему нужен pydantic<2, а crawl4ai нужен pydantic>=2.10.
# Он ставится в отдельное окружение .venv-2gis из requirements-2gis.txt и вызывается как CLI.
dependencies = [
    "crawl4ai>=0.9.5,<0.10",
    "anthropic>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
    "fastapi>=0.161,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["tanbala_leads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: нужен запущенный Postgres из docker-compose",
    "paid: реальный вызов API, только с разрешения владельца и с RUN_PAID=1",
]
# Опечатка в маркере (например paid) иначе молча дала бы неотмеченный тест.
addopts = "--strict-markers"
